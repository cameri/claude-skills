id = "omp-respawn"
name = "omp-respawn"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Runs omp as a herdr plugin pane's process and restarts it whenever it exits (crash or deliberate /exit), with a crash-loop guard and a stop-marker escape hatch. Ships inside the sandbox-manager package."

# omp runs AS the pane process (plugin-pane commands replace the shell), so
# its death is the pane's death: herdr emits pane.exited, restart.sh reopens
# the pane. Verified against herdr 0.8.2: command-exit fires pane.exited with
# {pane_id, workspace_id}; auto-closed plugin panes leave no tab behind.
[[panes]]
id = "omp"
title = "omp"
placement = "tab"
command = ["omp", "--cwd", "/workspace", "--auto-approve"]

[[events]]
on = "pane.exited"
command = ["bash", "-lc", "exec \"$HERDR_PLUGIN_ROOT/herdr/restart.sh\""]
